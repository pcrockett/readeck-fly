# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

name: Deploy

on:
  schedule:
    - cron: "29 2 * * 1"  # every Monday at 02:29 UTC <https://crontab.guru/#29_2_*_*_1>
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - name: flyctl deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DEPLOY_TOKEN }}
          FLY_APP: ${{ secrets.FLY_APP }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          test "${HEALTHCHECK_URL:-}" = "" || curl "${HEALTHCHECK_URL}/start"
          STATUS="fail"
          for _ in 1 2; do
            if flyctl deploy \
                --app "${FLY_APP}" \
                --config fly.template.toml \
                --remote-only; then
              STATUS="success"
              break  # break from retry loop
            else
              sleep 60  # sleep for 1 minute before retrying
            fi
          done
          test "${STATUS}" == "success"
          test "${HEALTHCHECK_URL:-}" = "" || curl "${HEALTHCHECK_URL}"
